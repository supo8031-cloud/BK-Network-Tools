name: Build BK Network Tools APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Build APK
    run: |
      docker run --rm \
        -v "$PWD":/home/user/hostcwd \
        -w /home/user/hostcwd \
        ghcr.io/kivy/buildozer:latest \
        buildozer android debug
