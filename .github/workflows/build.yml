
name: Build BK Network Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BK-Network-Tools-APK
          path: bin/*.apk
